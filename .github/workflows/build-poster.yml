# =============================================================================
# Workflow    : Poster
# Project     : The Knowledge Lifecycle of Large Language Models
# Purpose     : Compile the A0 conference poster to PDF on every change to it.
# Repository  : https://github.com/Amey-Thakur/LLM-KNOWLEDGE-LIFECYCLE
# License     : CC BY 4.0
# =============================================================================
#
# Independent of the manuscript and the slides. tikzposter drops content that
# runs past the page bottom without raising an error, so the poster is the
# artefact most likely to break silently.

name: Poster
permissions:
  contents: write


on:
  push:
    paths:
      - 'paper/poster.tex'
      - 'paper/amey-circle.png'
      - 'paper/sarvesh-circle.png'
      - '.github/workflows/build-poster.yml'
  pull_request:
    paths:
      - 'paper/poster.tex'
  workflow_dispatch:

jobs:
  poster:
    name: A0 poster
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile poster.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: poster.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Upload the poster
        uses: actions/upload-artifact@v4
        with:
          name: poster
          path: paper/poster.pdf

      # Publishes the freshly built PDF back to the repository so the copy in
      # the repo always matches the current source. [skip ci] and the paths
      # filters both keep this from re-triggering the build. This commit is by
      # github-actions[bot]; every source commit stays maintainer-authored.
      - name: Render preview and commit the rebuilt poster
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript
          gs -sDEVICE=png16m -dFirstPage=1 -dLastPage=1 -r40 -dTextAlphaBits=4 -dGraphicsAlphaBits=4 -o paper/figures/poster-preview.png paper/poster.pdf
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/poster.pdf paper/figures/poster-preview.png
          if git diff --cached --quiet; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git commit -m "Knowledge Lifecycle [skip ci]"
          # Discard the LaTeX build byproducts so the rebase sees a clean tree.
          git checkout -- . 2>/dev/null || true
          git clean -fdq
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 3))"
          done
          echo "::error::could not push the rebuilt artefact"
          exit 1
