# =============================================================================
# Workflow    : Slides
# Project     : The Knowledge Lifecycle of Large Language Models
# Purpose     : Compile the conference deck to PDF on every change to it.
# Repository  : https://github.com/Amey-Thakur/LLM-KNOWLEDGE-LIFECYCLE
# License     : CC BY 4.0
# =============================================================================
#
# Independent of the manuscript and the poster, so a failure in one does not
# hide a success in another.

name: Slides
permissions:
  contents: write


on:
  push:
    paths:
      - 'paper/presentation.tex'
      - 'paper/amey-thakur.jpg'
      - 'paper/sarvesh-talele.jpg'
      - '.github/workflows/build-slides.yml'
  pull_request:
    paths:
      - 'paper/presentation.tex'
  workflow_dispatch:

jobs:
  slides:
    name: Slide deck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile presentation.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: presentation.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Upload the slide deck
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: paper/presentation.pdf

      # Publishes each freshly built file straight to the branch tip via the
      # GitHub Contents API: no working tree, no rebase, and concurrent builds
      # touch different paths so they never collide. [skip ci] and the paths
      # filters keep the publish from re-triggering a build. This commit is by
      # github-actions[bot]; every source commit stays maintainer-authored.
      - name: Publish the rebuilt PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            path="$1"
            newsha=$(git hash-object "$path")
            cursha=$(gh api "repos/${{ github.repository }}/contents/$path?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || true)
            if [ "$newsha" = "$cursha" ]; then
              echo "$path unchanged; nothing to publish."
              return 0
            fi
            base64 -w0 "$path" > /tmp/content.b64
            if [ -n "$cursha" ]; then
              jq -n --arg m 'Knowledge Lifecycle [skip ci]' --arg b '${{ github.ref_name }}' --rawfile c /tmp/content.b64 --arg s "$cursha" '{message:$m,branch:$b,content:$c,sha:$s}' > /tmp/body.json
            else
              jq -n --arg m 'Knowledge Lifecycle [skip ci]' --arg b '${{ github.ref_name }}' --rawfile c /tmp/content.b64 '{message:$m,branch:$b,content:$c}' > /tmp/body.json
            fi
            gh api --method PUT "repos/${{ github.repository }}/contents/$path" --input /tmp/body.json > /dev/null
            echo "published $path"
          }
          publish paper/presentation.pdf
