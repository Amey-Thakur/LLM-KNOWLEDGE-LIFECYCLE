# =============================================================================
# Workflow    : Preprint
# Project     : The Knowledge Lifecycle of Large Language Models
# Purpose     : Compile the arXiv manuscript to PDF on every change, so broken LaTeX is
#               caught at the commit that introduced it rather than at
#               submission time.
# Repository  : https://github.com/Amey-Thakur/LLM-KNOWLEDGE-LIFECYCLE
# License     : CC BY 4.0
# =============================================================================
#
# One workflow per artefact, so a broken poster never masks a working
# manuscript. The paths filters keep a poster edit from rebuilding the paper.

name: Preprint
permissions:
  contents: write


on:
  push:
    # Only what main.tex reads. Globbing preprint/*.png and preprint/*.jpg would match
    # the poster and slide portraits and rebuild the paper on every poster edit.
    paths:
      - 'preprint/main.tex'
      - 'preprint/references.bib'
      - 'preprint/arxiv.sty'
      - 'preprint/orcid.png'
      - 'preprint/figures/**'
      - '.github/workflows/build-preprint.yml'
  pull_request:
    paths:
      - 'preprint/main.tex'
      - 'preprint/references.bib'
      - 'preprint/figures/**'
  workflow_dispatch:

jobs:
  manuscript:
    name: Manuscript
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Static faults a compiler does not catch: a reference resolving to
      # nothing, a label nobody uses, a citation with no entry in
      # references.bib, an abstract over the arXiv field limit, or a percent
      # sign that ate the rest of its line. This is the same auditor the five
      # SAIR manuscripts run. It follows \input, so labels defined in
      # results-table.tex count, and it strips citation keys before scanning
      # prose, so a key such as guu2020realm is not read as vocabulary.
      - name: Audit the manuscript
        run: python tools/audit_manuscript.py --tex preprint/main.tex

      # This paper exists because an earlier version made a headline claim
      # that was false. The correction was to regenerate every figure into
      # numbers.tex and cite the macros rather than type values. Nothing
      # enforced that until this step: it fails if a macro is defined and
      # never cited, if a macro's value also appears as a bare literal in
      # prose, or if numbers.tex is older than the script that makes it.
      - name: Check the generated numbers against the prose
        run: python tools/check_numbers.py

      # bibtex runs between the latexmk passes, so citations and the
      # bibliography resolve instead of rendering as question marks.
      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: preprint
          root_file: main.tex
          args: -pdf -bibtex -interaction=nonstopmode -file-line-error

      # An overfull box is text past the margin, a visible defect in the
      # printed paper; an unresolved reference prints as a question mark. The
      # other five manuscripts fail their build on either. This one did not,
      # which is the gap this step closes.
      - name: Fail on overfull boxes or undefined references
        if: always()
        run: |
          log=preprint/main.log
          if [ ! -f "$log" ]; then echo "no $log"; exit 1; fi
          over=$(grep -c 'Overfull \\hbox' "$log" || true)
          under=$(grep -c 'Underfull \\hbox' "$log" || true)
          undef=$(grep -ci 'undefined' "$log" || true)
          {
            echo "### LaTeX log"
            echo "| check | count |"
            echo "|---|---|"
            echo "| overfull hboxes | $over |"
            echo "| underfull hboxes | $under |"
            echo "| undefined references | $undef |"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          if [ "$over" -gt 0 ]; then
            echo "OVERFULL BOXES (text past the margin):" >> "$GITHUB_STEP_SUMMARY"
            grep -A2 'Overfull \\hbox' "$log" | head -40 >> "$GITHUB_STEP_SUMMARY"
            bad=1
          fi
          if [ "$undef" -gt 0 ]; then
            echo "UNDEFINED REFERENCES:" >> "$GITHUB_STEP_SUMMARY"
            grep -i 'undefined' "$log" | head -20 >> "$GITHUB_STEP_SUMMARY"
            bad=1
          fi
          exit $bad

      # main.bbl travels with the arXiv upload, so a difference in how apalike
      # resolves on their machine cannot change the bibliography.
      - name: Upload the manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: |
            preprint/main.pdf
            preprint/main.bbl

      # Publishes the freshly built PDF back to the repository so the repo copy
      # matches the current source. Authored as the maintainer via the Contents
      # API: no working tree, no rebase, and only when the PDF actually differs.
      # The committed PDF is in no paths filter, so it never re-triggers a build.
      - name: Publish the rebuilt paper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            path="$1"
            newsha=$(git hash-object "$path")
            cursha=$(gh api "repos/${{ github.repository }}/contents/$path?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || true)
            if [ "$newsha" = "$cursha" ]; then echo "$path unchanged."; return 0; fi
            base64 -w0 "$path" > /tmp/content.b64
            jq -n --arg m 'Knowledge Lifecycle' --arg b '${{ github.ref_name }}' --arg an 'Amey Thakur' --arg ae 'ameythakur20@gmail.com' --rawfile c /tmp/content.b64 --arg s "$cursha" '{message:$m,branch:$b,content:$c,committer:{name:$an,email:$ae},author:{name:$an,email:$ae}} + (if $s=="" then {} else {sha:$s} end)' > /tmp/body.json
            gh api --method PUT "repos/${{ github.repository }}/contents/$path" --input /tmp/body.json > /dev/null
            echo "published $path as Amey Thakur"
          }
          publish preprint/main.pdf
