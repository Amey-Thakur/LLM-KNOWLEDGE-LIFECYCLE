# =============================================================================
# Workflow    : Paper
# Project     : The Knowledge Lifecycle of Large Language Models
# Purpose     : Compile the manuscript to PDF on every change, so broken LaTeX is
#               caught at the commit that introduced it rather than at
#               submission time.
# Repository  : https://github.com/Amey-Thakur/LLM-KNOWLEDGE-LIFECYCLE
# License     : CC BY 4.0
# =============================================================================
#
# One workflow per artefact, so a broken poster never masks a working
# manuscript. The paths filters keep a poster edit from rebuilding the paper.

name: Paper
permissions:
  contents: write


on:
  push:
    # Only what main.tex reads. Globbing paper/*.png and paper/*.jpg would match
    # the poster and slide portraits and rebuild the paper on every poster edit.
    paths:
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/arxiv.sty'
      - 'paper/orcid.png'
      - 'paper/figures/**'
      - '.github/workflows/build-paper.yml'
  pull_request:
    paths:
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/figures/**'
  workflow_dispatch:

jobs:
  manuscript:
    name: Manuscript
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # bibtex runs between the latexmk passes, so citations and the
      # bibliography resolve instead of rendering as question marks.
      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          args: -pdf -bibtex -interaction=nonstopmode -file-line-error

      # main.bbl travels with the arXiv upload, so a difference in how apalike
      # resolves on their machine cannot change the bibliography.
      - name: Upload the manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: |
            paper/main.pdf
            paper/main.bbl

      # Publishes each freshly built file straight to the branch tip via the
      # GitHub Contents API: no working tree, no rebase, and concurrent builds
      # touch different paths so they never collide. [skip ci] and the paths
      # filters keep the publish from re-triggering a build. This commit is by
      # github-actions[bot]; every source commit stays maintainer-authored.
      - name: Publish the rebuilt PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            path="$1"
            newsha=$(git hash-object "$path")
            cursha=$(gh api "repos/${{ github.repository }}/contents/$path?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null || true)
            if [ "$newsha" = "$cursha" ]; then
              echo "$path unchanged; nothing to publish."
              return 0
            fi
            base64 -w0 "$path" > /tmp/content.b64
            if [ -n "$cursha" ]; then
              jq -n --arg m 'Knowledge Lifecycle [skip ci]' --arg b '${{ github.ref_name }}' --rawfile c /tmp/content.b64 --arg s "$cursha" '{message:$m,branch:$b,content:$c,sha:$s}' > /tmp/body.json
            else
              jq -n --arg m 'Knowledge Lifecycle [skip ci]' --arg b '${{ github.ref_name }}' --rawfile c /tmp/content.b64 '{message:$m,branch:$b,content:$c}' > /tmp/body.json
            fi
            gh api --method PUT "repos/${{ github.repository }}/contents/$path" --input /tmp/body.json > /dev/null
            echo "published $path"
          }
          publish paper/main.pdf
