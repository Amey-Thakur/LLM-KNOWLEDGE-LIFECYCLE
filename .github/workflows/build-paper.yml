# =============================================================================
# Workflow    : Paper
# Project     : The Knowledge Lifecycle of Large Language Models
# Purpose     : Compile the manuscript to PDF on every change, so broken LaTeX is
#               caught at the commit that introduced it rather than at
#               submission time.
# Repository  : https://github.com/Amey-Thakur/LLM-KNOWLEDGE-LIFECYCLE
# License     : CC BY 4.0
# =============================================================================
#
# One workflow per artefact, so a broken poster never masks a working
# manuscript. The paths filters keep a poster edit from rebuilding the paper.

name: Paper
permissions:
  contents: write


on:
  push:
    # Only what main.tex reads. Globbing paper/*.png and paper/*.jpg would match
    # the poster and slide portraits and rebuild the paper on every poster edit.
    paths:
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/arxiv.sty'
      - 'paper/orcid.png'
      - 'paper/figures/**'
      - '.github/workflows/build-paper.yml'
  pull_request:
    paths:
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/figures/**'
  workflow_dispatch:

jobs:
  manuscript:
    name: Manuscript
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # bibtex runs between the latexmk passes, so citations and the
      # bibliography resolve instead of rendering as question marks.
      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          args: -pdf -bibtex -interaction=nonstopmode -file-line-error

      # main.bbl travels with the arXiv upload, so a difference in how apalike
      # resolves on their machine cannot change the bibliography.
      - name: Upload the manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: |
            paper/main.pdf
            paper/main.bbl

      # Publishes the freshly built PDF back to the repository so the copy in
      # the repo always matches the current source. [skip ci] and the paths
      # filters both keep this from re-triggering the build. This commit is by
      # github-actions[bot]; every source commit stays maintainer-authored.
      - name: Commit the rebuilt paper
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git commit -m "Knowledge Lifecycle [skip ci]"
          # Discard the LaTeX build byproducts so the rebase sees a clean tree.
          git checkout -- . 2>/dev/null || true
          git clean -fdq
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 3))"
          done
          echo "::error::could not push the rebuilt artefact"
          exit 1
